openapi: 3.1.0
info:
  title: WEAVE Example Application API
  version: 1.0.0
  description: >-
    Example canonical REST API contract for separate frontend and backend agents.
    Replace the sample operations with your project's approved operations.
  x-weave-contract-state: FROZEN
  x-weave-approval-authority: main-orchestrator
servers:
  - url: http://localhost:4000
    description: Local example only; actual frontend host comes from NEXT_PUBLIC_API_BASE_URL
  - url: https://staging-api.example.invalid
    description: Placeholder, not a real server

tags:
  - name: Authentication
  - name: Users

paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: authLogin
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: usersGetMe
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      operationId: usersUpdateMe
      summary: Update current user's public profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Example bearer-token contract; choose storage/refresh strategy before production.

  responses:
    Unauthorized:
      description: Authentication invalid or missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Missing or invalid credentials
    ValidationError:
      description: Provided payload fails validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [accessToken, tokenType, expiresInSeconds, user]
          properties:
            accessToken:
              type: string
              description: Bearer access token
            tokenType:
              type: string
              const: Bearer
            expiresInSeconds:
              type: integer
              minimum: 1
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, VALIDATION_ERROR]
            message:
              type: string
